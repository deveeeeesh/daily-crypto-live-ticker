<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Crypto — Live BTC/ETH Price</title>
<meta name="viewport" content="width=1920,height=1080">
<style>
  /* OBS Browser Source: 1920x1080, transparent, position 0,0.
     Price plates sit inside the overlay's BITCOIN and ETHEREUM cards (DailyCryptoObs.tsx:
     coins slot 24,100 420x444 -> two cards 420x214, gap 16), over the bottom sparkline row. */
  @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
  :root {
    --black: #0A0B0D; --off: #F4F4F2; --gold: #F5B731;
    --green: #22C55E; --red: #EF4444; --btc: #F7931A; --eth: #8C9EFF; --muted: #8A8C92;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body.bg { background-size: 1920px 1080px; background-repeat: no-repeat; }

  /* card inner area: card x 24..444, left accent stripe 8px + 2px border -> content from x 34.
     plate spans the sparkline row: x 46..432, y = cardTop + 132 .. cardTop + 204 */
  .plate {
    position: absolute; left: 46px; width: 386px; height: 72px; box-sizing: border-box;
    display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px;
    border-radius: 12px; background: linear-gradient(180deg, #16150f 0%, #0c0d0f 100%);
    border: 1.5px solid var(--c); box-shadow: inset 0 0 18px var(--glow), 0 6px 18px rgba(0,0,0,0.45);
    opacity: 0; transition: opacity .6s ease;
  }
  .plate.ready { opacity: 1; }
  #BTC { top: 232px; --c: rgba(247,147,26,0.55); --glow: rgba(247,147,26,0.10); }
  #ETH { top: 462px; --c: rgba(140,158,255,0.55); --glow: rgba(140,158,255,0.10); }

  .left { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; }
  .cap { font-family: "Inter"; font-weight: 800; font-size: 12px; letter-spacing: 2.6px; color: var(--muted); line-height: 1; margin-bottom: 6px; white-space: nowrap; }
  .cap b { color: var(--tick); font-weight: 900; }
  #BTC .cap { --tick: var(--btc); }
  #ETH .cap { --tick: var(--eth); }
  .price {
    font-family: "Inter"; font-weight: 800; font-size: 36px; line-height: 1; color: var(--off); white-space: nowrap;
    font-variant-numeric: tabular-nums; letter-spacing: -0.6px; transform-origin: left center;
    transition: color .9s ease, text-shadow .9s ease;
  }
  .price.up   { color: var(--green); text-shadow: 0 0 14px rgba(34,197,94,0.55); transition: none; }
  .price.down { color: var(--red);   text-shadow: 0 0 14px rgba(239,68,68,0.55); transition: none; }

  .right { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .chg {
    font-family: "Inter"; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 6px 10px; border-radius: 999px; min-width: 104px; text-align: center; box-sizing: border-box;
  }
  .chg.pos { color: var(--green); background: rgba(34,197,94,0.13); border: 1.5px solid rgba(34,197,94,0.5); }
  .chg.neg { color: var(--red);   background: rgba(239,68,68,0.13); border: 1.5px solid rgba(239,68,68,0.5); }
  .chg-cap { font-family: "Inter"; font-weight: 800; font-size: 10px; letter-spacing: 2.2px; color: var(--muted); margin-top: 5px; }

  .status {
    position: absolute; right: 10px; top: -10px; font-family: "Inter"; font-weight: 800; font-size: 10px; letter-spacing: 1.8px;
    color: var(--black); background: var(--gold); padding: 3px 7px; border-radius: 5px; display: none;
  }
  .plate.stale .price, .plate.stale .chg { opacity: .45; }
  .plate.stale .status { display: block; }
</style>
</head>
<body>
<div class="plate" id="BTC">
  <div class="left"><div class="cap"><b>BTC</b> / USD · LIVE PRICE</div><div class="price">—</div></div>
  <div class="right"><div class="chg pos">—</div><div class="chg-cap">24H CHANGE</div></div>
  <div class="status">UPDATING…</div>
</div>
<div class="plate" id="ETH">
  <div class="left"><div class="cap"><b>ETH</b> / USD · LIVE PRICE</div><div class="price">—</div></div>
  <div class="right"><div class="chg pos">—</div><div class="chg-cap">24H CHANGE</div></div>
  <div class="status">UPDATING…</div>
</div>

<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  if (params.get("bg")) { document.body.classList.add("bg"); document.body.style.backgroundImage = `url("${params.get("bg")}")`; }
  const forceSource = params.get("source"); // optional: binance | coinbase | coingecko (for testing)

  // ---------- state + render ----------
  const STALE_MS = 60000;            // dim + "UPDATING…" if no fresh price for 60 s
  const SILENT_RECONNECT_MS = 20000; // a live socket silent for 20 s gets reopened
  const state = { BTC: { price: null, chg: null, shown: null }, ETH: { price: null, chg: null, shown: null } };
  let lastUpdate = 0;
  const fmt = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function update(sym, price, chg) {
    if (!state[sym] || !isFinite(price) || price <= 0) return;
    state[sym].price = price;
    if (isFinite(chg)) state[sym].chg = chg;
    lastUpdate = Date.now();
  }

  // shrink the price if it ever gets wider than its column (e.g. BTC above $1,000,000)
  function fit(priceEl) {
    priceEl.style.transform = "";
    const avail = priceEl.parentElement.clientWidth, w = priceEl.scrollWidth;
    if (w > avail) priceEl.style.transform = `scale(${avail / w})`;
  }

  // render at most 4x per second so fast feeds (Coinbase sends every trade) stay cheap
  function render() {
    const stale = lastUpdate > 0 && Date.now() - lastUpdate > STALE_MS;
    for (const sym of ["BTC", "ETH"]) {
      const s = state[sym], el = document.getElementById(sym);
      el.classList.toggle("stale", stale);
      if (s.price == null) continue;
      el.classList.add("ready");
      const priceEl = el.querySelector(".price");
      const text = "$" + fmt.format(s.price);
      if (text !== priceEl.textContent) {
        if (s.shown != null && s.price !== s.shown) {
          priceEl.classList.remove("up", "down");
          void priceEl.offsetWidth; // restart the flash
          priceEl.classList.add(s.price > s.shown ? "up" : "down");
          clearTimeout(priceEl._t);
          priceEl._t = setTimeout(() => priceEl.classList.remove("up", "down"), 350);
        }
        const widthChanged = text.length !== priceEl.textContent.length;
        priceEl.textContent = text;
        if (widthChanged) fit(priceEl);
        s.shown = s.price;
      }
      if (s.chg != null) {
        const c = el.querySelector(".chg");
        const pos = s.chg >= 0;
        const t = (pos ? "▲ +" : "▼ −") + Math.abs(s.chg).toFixed(2) + "%";
        if (c.textContent !== t) { c.textContent = t; c.className = "chg " + (pos ? "pos" : "neg"); }
      }
    }
  }
  setInterval(render, 250);

  // ---------- sources (tried in order, rotate on failure) ----------
  const SOURCES = {
    binance: {
      kind: "ws",
      url: "wss://data-stream.binance.vision/stream?streams=btcusdt@ticker/ethusdt@ticker",
      onMessage(msg) {
        const d = msg.data; if (!d || !d.s) return;
        const sym = d.s === "BTCUSDT" ? "BTC" : d.s === "ETHUSDT" ? "ETH" : null;
        if (sym) update(sym, parseFloat(d.c), parseFloat(d.P));
      },
    },
    coinbase: {
      kind: "ws",
      url: "wss://ws-feed.exchange.coinbase.com",
      onOpen(ws) { ws.send(JSON.stringify({ type: "subscribe", product_ids: ["BTC-USD", "ETH-USD"], channels: ["ticker"] })); },
      onMessage(d) {
        if (d.type !== "ticker") return;
        const sym = d.product_id === "BTC-USD" ? "BTC" : d.product_id === "ETH-USD" ? "ETH" : null;
        const p = parseFloat(d.price), o = parseFloat(d.open_24h);
        if (sym) update(sym, p, o > 0 ? ((p - o) / o) * 100 : NaN);
      },
    },
    coingecko: {
      kind: "poll",
      every: 30000,
      async fetchOnce() {
        const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        update("BTC", j.bitcoin.usd, j.bitcoin.usd_24h_change);
        update("ETH", j.ethereum.usd, j.ethereum.usd_24h_change);
      },
    },
  };
  const ORDER = forceSource && SOURCES[forceSource] ? [forceSource] : ["binance", "coinbase", "coingecko"];
  let idx = 0, failures = 0, cleanup = null, gotData = false;
  window.__ticker = { state, get source() { return ORDER[idx]; } }; // for debugging in a browser console

  function next(reason) {
    if (cleanup) { cleanup(); cleanup = null; }
    if (!gotData) failures++;
    // a source that never delivered twice in a row -> try the next one; a working source just reconnects
    if (failures >= 2) { failures = 0; idx = (idx + 1) % ORDER.length; }
    gotData = false;
    const delay = Math.min(15000, 1500 * Math.max(1, failures));
    console.log(`[ticker] ${reason} -> ${ORDER[idx]} in ${delay} ms`);
    setTimeout(start, delay);
  }

  function start() {
    const name = ORDER[idx], src = SOURCES[name];
    if (src.kind === "ws") {
      let ws, alive = Date.now(), dead = false;
      try { ws = new WebSocket(src.url); } catch (e) { return next(name + " ctor error"); }
      ws.onopen = () => { console.log("[ticker] connected:", name); if (src.onOpen) src.onOpen(ws); };
      ws.onmessage = (ev) => {
        alive = Date.now();
        try { src.onMessage(JSON.parse(ev.data)); gotData = true; failures = 0; } catch (e) {}
      };
      const finish = (why) => { if (dead) return; dead = true; next(name + " " + why); };
      ws.onclose = () => finish("closed");
      ws.onerror = () => finish("error");
      const watchdog = setInterval(() => { if (Date.now() - alive > SILENT_RECONNECT_MS) finish("silent"); }, 5000);
      cleanup = () => { dead = true; clearInterval(watchdog); ws.onclose = ws.onerror = ws.onmessage = null; try { ws.close(); } catch (e) {} };
    } else {
      let stopped = false, timer = null;
      const tick = async () => {
        if (stopped) return;
        try { await src.fetchOnce(); gotData = true; failures = 0; timer = setTimeout(tick, src.every); }
        catch (e) { if (!stopped) { stopped = true; next(name + " " + e.message); } }
      };
      cleanup = () => { stopped = true; clearTimeout(timer); };
      console.log("[ticker] polling:", name);
      tick();
    }
  }

  // also wake up if the page was throttled/hidden and is now stale
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && lastUpdate && Date.now() - lastUpdate > SILENT_RECONNECT_MS) next("resume");
  });

  // ?demo=1 -> sample numbers only, no network (layout check / screenshots). Never use on stream.
  if (params.get("demo")) {
    const big = params.get("demo") === "big";
    update("BTC", big ? 1234567.89 : 58714.01, -2.85); update("ETH", big ? 12345.67 : 1644.68, 1.12);
    document.fonts.ready.then(render);
    return;
  }

  document.fonts.ready.then(start);
})();
</script>
</body>
</html>
